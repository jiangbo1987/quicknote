<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNote</title>
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    
    .panel {
      position: absolute; top:0; left:0;
      width: 340px; height: 480px;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 16px;
      display: none; flex-direction: column;
      overflow: hidden;
    }
    .panel.active { display: flex; }
    
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; flex-shrink: 0;
      -webkit-app-region: drag;
    }
    .header h2 {
      font-size: 15px; color: #333; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .header-right {
      display: flex; gap: 4px; align-items: center;
      -webkit-app-region: no-drag;
    }
    .hdr-btn {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: #f0f0f0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; font-size: 13px;
      -webkit-app-region: no-drag; flex-shrink: 0;
    }
    .hdr-btn:hover { background: #e0e0e0; }
    .hdr-btn svg { width: 14px; height: 14px; fill: #666; }

    .limit-banner {
      background: linear-gradient(135deg,#fff3cd,#ffeaa7);
      border: 1px solid #ffc107; border-radius: 8px;
      padding: 6px 10px; margin-bottom: 8px; font-size: 11px; color: #856404;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      flex-shrink: 0;
    }
    .upgrade-link {
      background: linear-gradient(135deg,#FFD700,#FFA500);
      color: white; border: none; border-radius: 6px;
      padding: 3px 8px; font-size: 11px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
      -webkit-app-region: no-drag;
    }
    .upgrade-link:hover { transform: scale(1.05); }
    
    .pro-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: linear-gradient(135deg,#FFD700,#FFA500);
      color: white; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 10px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    
    .form-group { margin-bottom: 10px; }
    .form-group:last-of-type { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .form-group label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; font-weight: 500; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 8px 10px;
      border: 1.5px solid #e0e0e0; border-radius: 8px;
      font-size: 13px; background: white;
      -webkit-app-region: no-drag;
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #FFA500; }
    .form-group textarea { flex: 1; min-height: 150px; resize: none; overflow-y: auto; }
    
    .btn-save {
      width: 100%; padding: 10px;
      background: linear-gradient(135deg,#FFD700,#FFA500);
      color: white; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      margin-top: auto; flex-shrink: 0;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
      -webkit-app-region: no-drag;
    }
    .btn-save:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(255,165,0,0.5); }
    
    .notes-list { flex: 1; overflow-y: auto; margin-top: 8px; }
    .note-item {
      background: #fff8e1; padding: 10px 12px; border-radius: 10px;
      margin-bottom: 8px; border-left: 3px solid #FFA500;
      position: relative;
    }
    .note-item h4 { font-size: 13px; color: #333; margin-bottom: 4px; padding-right: 50px; }
    .note-item p { font-size: 12px; color: #666; line-height: 1.4; word-break: break-all; }
    .note-item .time { font-size: 10px; color: #999; margin-top: 4px; }
    .note-item .note-actions {
      position: absolute; top: 6px; right: 6px;
      display: flex; gap: 3px;
      opacity: 0; transition: opacity 0.2s;
    }
    .note-item:hover .note-actions { opacity: 1; }
    .note-action-btn {
      width: 22px; height: 22px; border: none; border-radius: 5px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      -webkit-app-region: no-drag;
    }
    .edit-btn { background: #e3f2fd; color: #1976d2; }
    .edit-btn:hover { background: #bbdefb; }
    .delete-btn { background: #fce4ec; color: #d32f2f; }
    .delete-btn:hover { background: #ef9a9a; }
    
    .empty-state { text-align: center; color: #999; padding: 30px 20px; font-size: 13px; }
    .back-btn {
      background: none; border: none; color: #FFA500;
      font-size: 12px; cursor: pointer; padding: 2px 0; margin-bottom: 6px;
      -webkit-app-region: no-drag;
    }
    .back-btn:hover { text-decoration: underline; }
    
    .history-container {
      position: absolute; top:0; left:0;
      width: 680px; height: 480px;
      background: rgba(255,255,255,0.98); backdrop-filter: blur(20px);
      border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 16px; display: none; flex-direction: row; gap: 16px;
    }
    .history-container.active { display: flex; }
    .history-left {
      width: 280px; flex-shrink: 0; display: flex; flex-direction: column;
      border-right: 1px solid #eee; padding-right: 12px; overflow-y: auto;
    }
    .history-right { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .calendar-header button {
      width: 26px; height: 26px; border: none; background: #f0f0f0;
      border-radius: 50%; cursor: pointer; font-size: 14px; color: #555;
      display: flex; align-items: center; justify-content: center;
      -webkit-app-region: no-drag;
    }
    .calendar-header button:hover { background: #e0e0e0; }
    .calendar-header span { font-size: 13px; font-weight: 600; color: #333; }
    .calendar-weekdays {
      display: grid; grid-template-columns: repeat(7,1fr);
      text-align: center; font-size: 10px; color: #999; margin-bottom: 2px;
    }
    .calendar-grid {
      display: grid; grid-template-columns: repeat(7,1fr);
      gap: 2px; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px;
    }
    .calendar-day {
      height: 28px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #333; border-radius: 6px; cursor: default;
      position: relative;
    }
    .calendar-day.has-notes { cursor: pointer; font-weight: 500; }
    .calendar-day.has-notes:hover { background: #fff3cd; }
    .calendar-day.has-notes::after {
      content:''; position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%);
      width: 5px; height: 5px; border-radius: 50%; background: #FFA500;
    }
    .calendar-day.active { background: #FFA500; color: white; font-weight: 600; }
    .calendar-day.active::after { background: white; }
    .calendar-day.other-month { color: #ccc; }
    .calendar-day.today { outline: 1.5px solid #FFA500; }

    /* 设置 */
    .settings-group { margin-bottom: 14px; }
    .settings-group label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; font-weight: 500; }
    .shortcut-row { display: flex; gap: 6px; align-items: center; }
    .shortcut-row input {
      flex: 1; padding: 7px 10px; border: 1.5px solid #e0e0e0;
      border-radius: 8px; font-size: 12px; background: #f8f8f8;
      cursor: pointer; text-align: center;
    }
    .shortcut-row input.recording { border-color: #FFA500; background: #fff8e1; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,165,0,0.3); }
      50% { box-shadow: 0 0 0 4px rgba(255,165,0,0.1); }
    }
    .shortcut-row button {
      padding: 7px 12px; border: 1.5px solid #e0e0e0;
      border-radius: 8px; background: #f8f8f8; font-size: 11px; cursor: pointer;
    }
    .shortcut-row button:hover { background: #eee; }
    .shortcut-hint { font-size: 10px; color: #999; margin-top: 4px; line-height: 1.4; }
    .btn-reset { margin-top: 6px; padding: 5px 10px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fff; font-size: 11px; color: #888; cursor: pointer; -webkit-app-region: no-drag; }
    .btn-reset:hover { background: #f5f5f5; }

    /* 弹窗 */
    .modal-overlay {
      position: absolute; top:0;left:0;right:0;bottom:0;
      background: rgba(0,0,0,0.4); display: none;
      align-items: center; justify-content: center; z-index: 100; border-radius: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: white; border-radius: 14px; padding: 24px 20px;
      width: 280px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
    }
    .modal-box h3 { font-size: 15px; color: #333; margin-bottom: 6px; }
    .modal-box p { font-size: 12px; color: #666; margin-bottom: 12px; line-height: 1.5; }
    .modal-box input[type="text"] {
      width: 100%; padding: 8px 10px; border: 1.5px solid #e0e0e0;
      border-radius: 8px; font-size: 13px; text-align: center;
      letter-spacing: 1px; margin-bottom: 8px; outline: none;
      -webkit-app-region: no-drag;
    }
    .modal-box input[type="text"]:focus { border-color: #FFA500; }
    .modal-box .btn-row { display: flex; gap: 6px; }
    .modal-box .btn-cancel, .modal-box .btn-ok {
      flex: 1; padding: 8px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .modal-box .btn-cancel { background: #f0f0f0; color: #666; }
    .modal-box .btn-ok { background: linear-gradient(135deg,#FFD700,#FFA500); color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .modal-box .btn-danger { background: #d32f2f; color: white; }
    .modal-box .error-msg { color: #e74c3c; font-size: 11px; margin-bottom: 6px; min-height: 14px; }
  </style>
</head>
<body>
  <!-- 表单 -->
  <div class="panel active" id="formContainer">
    <div class="header">
      <h2 id="formTitle">📝 快速记录</h2>
      <div class="header-right">
        <button class="hdr-btn" id="settingsBtn" title="设置">⚙️</button>
        <button class="hdr-btn" id="closeForm" title="关闭">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>
    <div class="limit-banner" id="limitBanner" style="display:none;">
      <span id="limitText"></span>
      <button class="upgrade-link" id="upgradeBtn">💎 升级专业版</button>
    </div>
    <div class="form-group">
      <label>标题</label>
      <input type="text" id="noteTitle" placeholder="输入标题..." />
    </div>
    <div class="form-group">
      <label>内容</label>
      <textarea id="noteContent" placeholder="输入内容..."></textarea>
    </div>
    <button class="btn-save" id="saveBtn">💾 保存</button>
  </div>
  
  <!-- 今日笔记 -->
  <div class="panel" id="notesContainer">
    <div class="header">
      <h2>📋 今日笔记</h2>
      <div class="header-right">
        <button class="hdr-btn" id="closeNotes">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>
    <button class="back-btn" id="backToForm">← 返回记录</button>
    <div class="notes-list" id="notesList"></div>
    <div class="license-status-bar" id="licenseStatusBar" style="display:none;padding:8px;text-align:center;font-size:12px;color:#666;background:#f5f5f5;border-top:1px solid #eee;"></div>
  </div>
  
  <!-- 历史笔记 -->
  <div class="history-container" id="historyContainer">
    <div class="history-left">
      <div class="header">
        <h2>📅 历史笔记</h2>
        <button class="hdr-btn" id="closeHistory">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <button class="back-btn" id="backToFormFromHistory">← 返回记录</button>
      <div class="calendar-header">
        <button id="prevMonth">‹</button>
        <span id="calendarTitle"></span>
        <button id="nextMonth">›</button>
      </div>
      <div class="calendar-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <button class="upgrade-link" id="upgradeBtnCalendar" style="width:100%;padding:6px;margin-top:auto;font-size:11px;display:none;">💎 升级专业版</button>
      
      <!-- 授权状态条 -->
      <div class="license-status-bar" id="licenseStatusBarHistory" style="display:none;padding:10px;text-align:center;font-size:13px;color:#333;background:linear-gradient(135deg,#fff8e1,#fff3cd);border-top:2px solid #FFA500;flex-shrink:0;font-weight:500;"></div>
      
    </div>
    <div class="history-right">
      <div class="notes-list" id="historyNotesList"></div>
    </div>
  </div>

  <!-- 设置 -->
  <div class="panel" id="settingsContainer">
    <div class="header">
      <h2>⚙️ 设置</h2>
      <div class="header-right">
        <button class="hdr-btn" id="closeSettings">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>
    <button class="back-btn" id="backFromSettings">← 返回记录</button>
    <div style="overflow-y:auto;max-height:420px;padding-right:5px;">
    <div class="settings-group">
      <label>⌨️ 打开表单快捷键</label>
      <div class="shortcut-row">
        <input type="text" id="shortcutInput" readonly placeholder="点击录制..." />
        <button id="recordShortcutBtn">录制</button>
      </div>
      <div class="shortcut-hint" id="shortcutHint">当前：⌘+Shift+N<br>点击「录制」然后按新快捷键</div>
      <button class="btn-reset" id="resetShortcutBtn">恢复默认 ⌘+Shift+N</button>
    </div>
    <div class="settings-group">
      <div class="settings-label">📁 笔记保存路径</div>
      <div class="shortcut-row">
        <input type="text" id="notesDirInput" readonly placeholder="默认路径" />
        <button id="chooseDirBtn">选择</button>
      </div>
      <div class="shortcut-hint" id="notesDirHint">留空则使用默认路径</div>
      <button class="btn-reset" id="resetDirBtn">恢复默认路径</button>
      <button class="btn-reset" id="openDirBtn" style="margin-left:8px;">📂 打开文件夹</button>
    </div>
    <div class="settings-group">
      <label>📱 关注公众号</label>
      <div style="text-align:center;padding:8px 0;">
        <img src="wechat-mp.jpg" alt="QuickNote 公众号" style="width:120px;height:120px;border-radius:10px;border:1px solid #eee;object-fit:cover;" />
        <p style="font-size:11px;color:#999;margin-top:6px;">扫码关注获取更新 & 交流反馈</p>
      </div>
    </div>
    <div class="settings-group" id="licenseInfo" style="display:none;">
      <label>💎 授权信息</label>
      <div style="font-size:12px;color:#555;line-height:1.8;">
        <div>授权类型：<strong id="licenseTypeText"></strong></div>
        <div>激活时间：<span id="licenseActivatedAt"></span></div>
        <div id="licenseExpiresAtRow" style="display:none;">过期时间：<span id="licenseExpiresAt"></span></div>
      </div>
      <button class="btn-reset" id="deactivateLicenseBtn" style="margin-top:8px;">取消授权</button>
    </div>
    <div class="settings-group" style="margin-top:auto;">
      <label>📝 关于</label>
      <div style="font-size:11px;color:#888;line-height:1.6;">QuickNote v1.2.0<br>桌面悬浮快捷笔记<br>数据本地存储，隐私安全</div>
    </div>
    </div>
  </div>

  <!-- 授权弹窗 -->
  <div class="modal-overlay" id="licenseModal">
    <div class="modal-box">
      <h3>💎 激活专业版</h3>
      <p>输入授权码即可解锁无限笔记</p>
      <div style="background:#f5f5f5;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:12px;">
        <div style="color:#666;margin-bottom:4px;">本机机器码：</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <code id="machineCodeDisplay" style="font-size:14px;font-weight:600;color:#333;user-select:all;">加载中...</code>
          <button id="copyMachineCodeBtn" style="padding:2px 8px;font-size:11px;background:#007AFF;color:#fff;border:none;border-radius:4px;cursor:pointer;">复制</button>
        </div>
      </div>
      <input type="text" id="licenseInput" placeholder="QNPRO-XXXX-XXXX-XXXX-XXXX" maxlength="31" />
      <div class="error-msg" id="licenseError"></div>
      <div class="btn-row">
        <button class="btn-cancel" id="licenseCancel">取消</button>
        <button class="btn-ok" id="licenseOk">激活</button>
      </div>

    </div>
  </div>

  <!-- 删除确认 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
      <h3>🗑️ 删除笔记</h3>
      <p>确定删除这条笔记吗？<br>此操作不可撤销。</p>
      <div class="btn-row">
        <button class="btn-cancel" id="deleteCancel">取消</button>
        <button class="btn-ok btn-danger" id="deleteOk">删除</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron').remote || require('electron');

    const $ = id => document.getElementById(id);

    const formContainer = $('formContainer');
    const notesContainer = $('notesContainer');
    const historyContainer = $('historyContainer');
    const settingsContainer = $('settingsContainer');
    const noteTitle = $('noteTitle');
    const noteContent = $('noteContent');
    const saveBtn = $('saveBtn');
    const notesList = $('notesList');
    const historyNotesList = $('historyNotesList');
    const limitBanner = $('limitBanner');
    const limitText = $('limitText');
    const licenseModal = $('licenseModal');
    const licenseInput = $('licenseInput');
    const licenseError = $('licenseError');
    const deleteModal = $('deleteModal');
    const shortcutInput = $('shortcutInput');
    const shortcutHint = $('shortcutHint');

    let isPro = false, noteCount = 0, noteLimit = 100, licenseInfo = null;
    let editingNoteId = null, deletingNoteId = null;
    let isRecordingShortcut = false;
    let currentShortcut = 'CommandOrControl+Shift+N';

    // ===== 面板切换 =====
    function switchPanel(id) {
      [formContainer, notesContainer, historyContainer, settingsContainer].forEach(p => p.classList.remove('active'));
      $(id).classList.add('active');
    }

    // ===== 初始化 =====
    async function initLicense() {
      console.log('[initLicense] 开始初始化授权');
      try {
        const r = await ipcRenderer.invoke('check-license');
        isPro = r.valid; noteCount = r.noteCount || 0; noteLimit = r.limit || 100;
        licenseInfo = r; // 同步更新 licenseInfo，防止状态条显示过期数据
        updateUI();
      } catch(e) { licenseInfo = { valid: false }; updateUI(); }
    }

    async function initSettings() {
      try {
        const s = await ipcRenderer.invoke('get-settings');
        currentShortcut = s.shortcut || 'CommandOrControl+Shift+N';
        updateShortcutDisplay();
        // 笔记路径
        const notesDir = s.notesDir || '';
        $('notesDirInput').value = notesDir || '默认路径（应用数据目录）';
        $('notesDirHint').textContent = notesDir ? '笔记将保存到此目录' : '留空则使用默认路径';
      } catch(e) {}
      
      // 加载授权信息
      await loadLicenseInfo();
    }

    async function loadLicenseInfo() {
      try {
        const license = await ipcRenderer.invoke('check-license');
        licenseInfo = license;
        const licenseInfoEl = $('licenseInfo');
        
        if (license.valid) {
          licenseInfoEl.style.display = 'block';
          $('licenseTypeText').textContent = license.type === 'annual' ? '年费版 (¥9.9/年)' : '终身版 (¥49)';
          $('licenseActivatedAt').textContent = new Date(license.activatedAt).toLocaleDateString('zh-CN');
          if (license.type === 'annual') {
            $('licenseExpiresAtRow').style.display = 'block';
            $('licenseExpiresAt').textContent = new Date(license.expiresAt).toLocaleDateString('zh-CN');
          } else {
            $('licenseExpiresAtRow').style.display = 'none';
          }
        } else {
          licenseInfoEl.style.display = 'none';
        }
      } catch(e) {
        licenseInfo = { valid: false };
        console.error('加载授权信息失败:', e);
      }
      // 统一由 updateUI 刷新两个状态条，避免历史页状态条残留旧数据
      updateUI();
    }

    async function updateUI() {
      // 每次刷新前先获取最新授权状态，防止 license.json 被删除后状态条显示旧数据
      try {
        const r = await ipcRenderer.invoke('check-license');
        isPro = r.valid;
        licenseInfo = r;
        noteCount = r.noteCount || 0;
        noteLimit = r.limit || 100;
      } catch(e) { console.error('[updateUI] 刷新授权状态失败:', e); }
      
      console.log('[updateUI] isPro=' + isPro + ', licenseInfo=', JSON.stringify(licenseInfo));
      
      // 更新标题栏 Pro 徽章
      const titleProBadge = $('titleProBadge');
      if (titleProBadge) titleProBadge.style.display = isPro ? 'inline' : 'none';
      
      // 更新限制提示
      const limitEl = $('noteLimit');
      if (limitEl) limitEl.textContent = isPro ? '无限' : noteLimit;
      const limitBanner = $('limitBanner');
      if (limitBanner) limitBanner.style.display = (isPro || noteCount < noteLimit) ? 'none' : 'block';
      
      // ===== 更新今日笔记页面的状态条 =====
      const statusBar = $('licenseStatusBar');
      if (statusBar) {
        if (licenseInfo && licenseInfo.valid) {
          if (licenseInfo.type === 'lifetime') {
            statusBar.textContent = '👑 终身版 · 永久有效';
          } else if (licenseInfo.type === 'annual') {
            const exp = new Date(licenseInfo.expiresAt);
            const yyyy = exp.getFullYear();
            const mm = String(exp.getMonth()+1).padStart(2,'0');
            const dd = String(exp.getDate()).padStart(2,'0');
            statusBar.textContent = '💎 年费版 · 有效期至 ' + yyyy + '-' + mm + '-' + dd;
          }
          statusBar.style.display = 'block';
        } else {
          statusBar.style.display = 'none';
        }
        console.log('[updateUI] 今日笔记状态条已更新:', statusBar.textContent);
      } else {
        console.error('[updateUI] 未找到 licenseStatusBar');
      }
      
      // ===== 更新历史笔记页面的状态条 =====
      const statusBarHistory = $('licenseStatusBarHistory');
      if (statusBarHistory) {
        if (licenseInfo && licenseInfo.valid) {
          if (licenseInfo.type === 'lifetime') {
            statusBarHistory.textContent = '👑 终身版 · 永久有效';
          } else if (licenseInfo.type === 'annual') {
            const exp = new Date(licenseInfo.expiresAt);
            const yyyy = exp.getFullYear();
            const mm = String(exp.getMonth()+1).padStart(2,'0');
            const dd = String(exp.getDate()).padStart(2,'0');
            statusBarHistory.textContent = '💎 年费版 · 有效期至 ' + yyyy + '-' + mm + '-' + dd;
          }
          statusBarHistory.style.display = 'block';
        } else {
          statusBarHistory.style.display = 'none';
        }
        console.log('[updateUI] 历史笔记状态条已更新:', statusBarHistory.textContent);
      } else {
        console.error('[updateUI] 未找到 licenseStatusBarHistory');
      }
      
      // 更新升级按钮（保持原有逻辑）
      const uc = $('upgradeBtnCalendar'); 
      if(uc) uc.style.display = isPro ? 'none' : 'block';
    }

    // ===== 关闭 =====
    $('closeForm').onclick = () => ipcRenderer.send('window-close');
    $('closeNotes').onclick = () => ipcRenderer.send('window-close');
    $('closeHistory').onclick = () => ipcRenderer.send('window-close');
    $('closeSettings').onclick = () => ipcRenderer.send('window-close');

    $('backToForm').onclick = () => { switchPanel('formContainer'); clearEdit(); noteTitle.focus(); };
    $('backToFormFromHistory').onclick = () => { switchPanel('formContainer'); clearEdit(); noteTitle.focus(); };
    $('backFromSettings').onclick = () => { switchPanel('formContainer'); noteTitle.focus(); };

    // ===== 设置 =====
    $('settingsBtn').onclick = () => { switchPanel('settingsContainer'); initSettings(); };

    function fmtShortcut(s) {
      return s.replace(/CommandOrControl\+/g,'⌘+').replace(/Command\+/g,'⌘+')
        .replace(/Control\+/g,'Ctrl+').replace(/Shift\+/g,'Shift+').replace(/Alt\+/g,'Alt+');
    }

    function updateShortcutDisplay() {
      shortcutInput.value = fmtShortcut(currentShortcut);
      shortcutHint.innerHTML = `当前：${fmtShortcut(currentShortcut)}<br>点击「录制」然后按新快捷键`;
    }

    $('recordShortcutBtn').onclick = () => {
      isRecordingShortcut = true;
      shortcutInput.value = '请按下快捷键组合...';
      shortcutInput.classList.add('recording');
      $('recordShortcutBtn').textContent = '...';
      $('recordShortcutBtn').disabled = true;
    };

    document.addEventListener('keydown', async (e) => {
      if (!isRecordingShortcut) return;
      e.preventDefault(); e.stopPropagation();
      if (['Shift','Control','Alt','Meta'].includes(e.key)) return;

      let parts = [];
      if (e.metaKey || e.ctrlKey) parts.push('CommandOrControl');
      if (e.shiftKey) parts.push('Shift');
      if (e.altKey) parts.push('Alt');
      if (parts.length === 0) { shortcutInput.value = '需要修饰键(⌘/Ctrl)+...'; return; }

      let key = e.key === ' ' ? 'Space' : (e.key.length === 1 ? e.key.toUpperCase() : e.key);
      parts.push(key);
      const accel = parts.join('+');

      currentShortcut = accel;
      const r = await ipcRenderer.invoke('save-settings', { shortcut: accel });
      isRecordingShortcut = false;
      shortcutInput.classList.remove('recording');
      $('recordShortcutBtn').textContent = '录制';
      $('recordShortcutBtn').disabled = false;
      if (r.success && r.shortcutOk) {
        updateShortcutDisplay();
        shortcutInput.value = fmtShortcut(accel) + ' ✓';
        setTimeout(() => { shortcutInput.value = fmtShortcut(currentShortcut); }, 1500);
      } else if (r.success && !r.shortcutOk) {
        // 注册失败，回退到上一个可用的快捷键
        shortcutInput.value = '❌ 注册失败（被系统占用）';
        shortcutHint.innerHTML = `快捷键 ${fmtShortcut(accel)} 被系统占用，请换一个<br>提示：避免使用 ⌘+A/C/V/Q 等系统快捷键`;
      }
    });

    $('resetShortcutBtn').onclick = async () => {
      currentShortcut = 'CommandOrControl+Shift+N';
      await ipcRenderer.invoke('save-settings', { shortcut: currentShortcut });
      updateShortcutDisplay();
    };

    $('chooseDirBtn').onclick = async () => {
      const dir = await ipcRenderer.invoke('choose-notes-dir');
      if (dir) {
        await ipcRenderer.invoke('save-settings', { notesDir: dir });
        $('notesDirInput').value = dir;
        $('notesDirHint').textContent = '笔记将保存到此目录';
        await loadDates();
      }
    };

    $('resetDirBtn').onclick = async () => {
      await ipcRenderer.invoke('save-settings', { notesDir: '' });
      $('notesDirInput').value = '默认路径（应用数据目录）';
      $('notesDirHint').textContent = '留空则使用默认路径';
      await loadDates();
    };
    $('openDirBtn').onclick = async () => {
      await ipcRenderer.invoke('open-notes-dir');
    };

    // ===== 取消授权 =====
    $('deactivateLicenseBtn').onclick = async () => {
      if (!confirm('确定要取消授权吗？取消后免费版限制将重新生效。')) return;
      
      const r = await ipcRenderer.invoke('deactivate-license');
      if (r.success) {
        alert('✅ 授权已取消');
        await loadLicenseInfo();
        isPro = false;
        updateUI();
      } else {
        alert('❌ 取消授权失败：' + (r.message || '未知错误'));
      }
    };

    // ===== 编辑 =====
    function startEdit(id, title, content) {
      editingNoteId = id;
      noteTitle.value = title;
      noteContent.value = content;
      saveBtn.textContent = '✏️ 更新';
      $('formTitle').innerHTML = '✏️ 编辑笔记';
      switchPanel('formContainer');
      noteTitle.focus();
    }

    function clearEdit() {
      editingNoteId = null;
      noteTitle.value = '';
      noteContent.value = '';
      saveBtn.textContent = '💾 保存';
      $('formTitle').innerHTML = '📝 快速记录' + (isPro ? ' <span class="pro-badge">PRO</span>' : '');
    }

    // ===== 删除 =====
    function confirmDelete(id) {
      deletingNoteId = id;
      deleteModal.classList.add('active');
    }
    $('deleteCancel').onclick = () => { deletingNoteId = null; deleteModal.classList.remove('active'); };
    $('deleteOk').onclick = async () => {
      if (deletingNoteId !== null) {
        const r = await ipcRenderer.invoke('delete-note', deletingNoteId);
        if (r.success) { noteCount = r.noteCount; updateUI(); refreshCurrentView(); }
      }
      deletingNoteId = null;
      deleteModal.classList.remove('active');
    };

    // ===== 升级 =====
    async function openLicenseModal() {
      licenseModal.classList.add('active');
      licenseInput.focus();
      try {
        const result = await ipcRenderer.invoke('get-machine-code');
        $('machineCodeDisplay').textContent = result.machineCode;
      } catch(e) {
        $('machineCodeDisplay').textContent = '获取失败';
      }
    }
    $('upgradeBtn').onclick = openLicenseModal;
    $('upgradeBtnCalendar').onclick = openLicenseModal;
    $('licenseCancel').onclick = () => { licenseModal.classList.remove('active'); licenseInput.value=''; licenseError.textContent=''; };
    $('licenseOk').onclick = async () => {
      const key = licenseInput.value.trim();
      if (!key) { licenseError.textContent = '请输入授权码'; return; }
      licenseError.textContent = '验证中...';
      try {
        const r = await ipcRenderer.invoke('verify-license', key);
        if (r.success) {
          licenseModal.classList.remove('active'); licenseInput.value=''; licenseError.textContent='';
          isPro = true; updateUI();
          const typeText = r.type === 'annual' ? '年费版（¥9.9/年）' : '终身版（¥49）';
          alert('🎉 激活成功！' + typeText + '\n专业版无限记录。');
        } else { licenseError.textContent = r.message || '授权码无效'; }
      } catch(e) {
        licenseError.textContent = '验证失败：' + (e.message || '未知错误');
      }
    };
    // licenseBuy removed
    licenseInput.addEventListener('keydown', e => { if(e.key==='Enter') $('licenseOk').click(); });
    $('copyMachineCodeBtn').onclick = async () => {
      const code = $('machineCodeDisplay').textContent;
      if (code && code !== '加载中...' && code !== '获取失败') {
        await navigator.clipboard.writeText(code);
        const btn = $('copyMachineCodeBtn');
        btn.textContent = '已复制';
        setTimeout(() => btn.textContent = '复制', 1500);
      }
    };

    // ===== 保存/更新 =====
    saveBtn.onclick = async () => {
      const title = noteTitle.value.trim();
      const content = noteContent.value.trim();
      if (!title && !content) { noteTitle.focus(); return; }

      if (editingNoteId !== null) {
        const r = await ipcRenderer.invoke('update-note', editingNoteId, title, content);
        if (r.success) {
          clearDraft();
          clearEdit();
          saveBtn.textContent = '✓ 已更新';
          setTimeout(() => { saveBtn.textContent = '💾 保存'; }, 600);
        } else { alert(r.message || '更新失败'); }
        return;
      }

      if (!isPro && noteCount >= noteLimit) {
        alert(`免费版最多 ${noteLimit} 条。\n升级专业版 ¥9.9/年 或 ¥49终身 无限记录！`);
        openLicenseModal(); return;
      }

      const r = await ipcRenderer.invoke('save-note', title, content);
      if (r.success) {
        clearDraft();
        noteCount = r.noteCount || noteCount + 1; updateUI();
        noteTitle.value=''; noteContent.value='';
        saveBtn.textContent = '✓ 已保存';
        setTimeout(() => { saveBtn.textContent = '💾 保存'; noteTitle.focus(); }, 600);
      } else if (r.error === 'NOTE_LIMIT_REACHED') {
        alert(r.message); openLicenseModal();
      }
    };

    document.addEventListener('keydown', e => {
      if (isRecordingShortcut) return;
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') saveBtn.click();
    });

    // ===== 草稿功能 =====
    const DRAFT_KEY = 'quicknote_draft';
    function loadDraft() {
      try {
        const raw = localStorage.getItem(DRAFT_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch(e) { return null; }
    }
    function saveDraft() {
      const title = noteTitle.value;
      const content = noteContent.value;
      if (title || content) {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ title, content, timestamp: Date.now() }));
      }
    }
    function clearDraft() {
      localStorage.removeItem(DRAFT_KEY);
    }
    function restoreDraft() {
      const draft = loadDraft();
      if (draft) {
        noteTitle.value = draft.title || '';
        noteContent.value = draft.content || '';
      }
    }

    // 自动保存草稿
    noteTitle.addEventListener('input', saveDraft);
    noteContent.addEventListener('input', saveDraft);

    // ===== 主进程消息 =====
    ipcRenderer.on('show-form', () => {
      // 检查是否有草稿，有则直接恢复（不再弹 confirm 提示）
      const draft = loadDraft();
      
      // 切换面板、清空编辑状态
      switchPanel('formContainer');
      clearEdit();
      initLicense();
      
      // 直接恢复草稿（如果有）
      if (draft && (draft.title || draft.content)) {
        restoreDraft();
      }
      
      noteTitle.focus();
    });
    ipcRenderer.on('show-today-notes', async () => { switchPanel('notesContainer'); await loadTodayNotes(); });
    ipcRenderer.on('show-history-notes', async () => { switchPanel('historyContainer'); await loadDates(); updateUI(); });
    ipcRenderer.on('show-settings', () => { switchPanel('settingsContainer'); initSettings(); updateUI(); });

    // ===== 笔记渲染（事件委托） =====
    function escHtml(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

    // 用事件委托处理编辑/删除
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const noteId = parseInt(btn.dataset.noteId);
      const item = btn.closest('.note-item');
      if (!item) return;

      if (action === 'edit') {
        const title = item.dataset.noteTitle || '';
        const content = item.dataset.noteContent || '';
        startEdit(noteId, title, content);
      } else if (action === 'delete') {
        confirmDelete(noteId);
      }
    });

    function renderNote(n) {
      const updated = n.updatedTime ? ' · 已编辑' : '';
      // 用 data 属性存储内容，避免 inline onclick 转义问题
      return `<div class="note-item" data-note-id="${n.id}" data-note-title="${escAttr(n.title)}" data-note-content="${escAttr(n.content)}">
        <div class="note-actions">
          <button class="note-action-btn edit-btn" data-action="edit" data-note-id="${n.id}" title="编辑">✏️</button>
          <button class="note-action-btn delete-btn" data-action="delete" data-note-id="${n.id}" title="删除">🗑️</button>
        </div>
        <h4>${escHtml(n.title)}</h4>
        <p>${escHtml(n.content)}</p>
        <div class="time">${n.time}${updated}</div>
      </div>`;
    }

    function escAttr(s) {
      return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'&#10;');
    }

    async function loadTodayNotes() {
      const notes = await ipcRenderer.invoke('get-today-notes');
      notesList.innerHTML = notes.length === 0
        ? '<div class="empty-state">今天还没有记录</div>'
        : notes.map(n => renderNote(n)).reverse().join('');
    }

    async function refreshCurrentView() {
      if (notesContainer.classList.contains('active')) await loadTodayNotes();
      if (historyContainer.classList.contains('active') && selectedDate) await loadNotesByDate(selectedDate);
    }

    // ===== 日历 =====
    let currentYear, currentMonth, notesDates = new Set(), selectedDate = null;

    $('prevMonth').onclick = () => { currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(currentYear,currentMonth); };
    $('nextMonth').onclick = () => { currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;} renderCalendar(currentYear,currentMonth); };

    async function loadDates() {
      const dates = await ipcRenderer.invoke('get-notes-dates');
      notesDates = new Set(dates);
      const t = new Date(); currentYear = t.getFullYear(); currentMonth = t.getMonth();
      renderCalendar(currentYear, currentMonth);
    }

    function renderCalendar(year, month) {
      const grid = $('calendarGrid');
      $('calendarTitle').textContent = `${year}年${month+1}月`;
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const t = new Date();
      const todayStr = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
      let html = '';
      for (let i=0; i<firstDay; i++) html += '<div class="calendar-day other-month"></div>';
      for (let d=1; d<=daysInMonth; d++) {
        const mm = String(month+1).padStart(2,'0');
        const dd = String(d).padStart(2,'0');
        const ds = `${year}-${mm}-${dd}`;
        const has = notesDates.has(ds);
        let cls = 'calendar-day'; if(has) cls+=' has-notes';
        if(ds===selectedDate) cls+=' active'; else if(ds===todayStr) cls+=' today';
        const oc = has ? ` onclick="pickDate('${ds}')"` : '';
        html += `<div class="${cls}"${oc}>${d}</div>`;
      }
      grid.innerHTML = html;
    }

    window.pickDate = async (ds) => { selectedDate=ds; renderCalendar(currentYear,currentMonth); await loadNotesByDate(ds); };

    async function loadNotesByDate(date) {
      const notes = await ipcRenderer.invoke('get-notes-by-date', date);
      historyNotesList.innerHTML = notes.length === 0
        ? `<div class="empty-state">${date} 没有笔记</div>`
        : notes.map(n => renderNote(n)).reverse().join('');
    }

    initLicense(); initSettings();
  </script>
</body>
</html>
